name: PeaceOut
version: "1.3.0"
main: c0mpile.peaceout.PeaceOut
api-version: "26.2"
author: c0mpile
description: Personal configurable protections and quality-of-life features.

commands:
  peaceout:
    description: Open PeaceOut or manage personal settings.
    usage: /peaceout [setting|admin|status]
    aliases:
      - po

  trash:
    description: Open a temporary trash can.
    usage: /trash

  bp:
    description: Open a backpack or backpack selector.
    usage: /bp [number]

permissions:
  peaceout.use:
    description: Allows personal PeaceOut settings.
    default: false

  peaceout.admin:
    description: Allows access to the PeaceOut admin menu.
    default: op

  peaceout.trash:
    description: Allows use of the trash can.
    default: false

  peaceout.backpack:
    description: Allows use of backpacks.
    default: false

  peaceout.backpacks.1:
    description: Allows one backpack.
    default: false

  peaceout.backpacks.2:
    description: Allows two backpacks.
    default: false

  peaceout.backpacks.3:
    description: Allows three backpacks.
    default: false

  peaceout.backpacks.4:
    description: Allows four backpacks.
    default: false

